<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイPWAプロトタイプ</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a90e2">
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <h1><i class="fa-solid fa-mobile-screen-button"></i> PWA App</h1>
  </header>

  <!-- メインコンテンツ -->
  <main class="app-main">
    
    <!-- メイン画像エリア (画像差し替え用) -->
    <section class="image-card">
      <div class="image-wrapper">
        <!-- デザインチームから画像が届いたら src を差し替えます -->
        <img src="images/hero-sample.png" alt="メインビジュアル" id="mainHeroImg" class="replaceable-img">
      </div>
      <p class="image-caption">サンプル画像（`images/hero-sample.png`）</p>
    </section>

    <!-- 機能テストエリア -->
    <section class="content-card">
      <h2><i class="fa-solid fa-rocket"></i> プロトタイプへようこそ</h2>
      <p>このアプリはPWAに対応しています。スマホのブラウザメニューから「ホーム画面に追加」を行うことでアプリとして利用できます。</p>
      
      <button id="actionBtn" class="primary-btn">
        <i class="fa-solid fa-hand-pointer"></i> タップしてみる
      </button>
      <p id="statusText" class="status-message"></p>
    </section>

  </main>

  <!-- ボトムナビゲーション (スマホ向け) -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>ホーム</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>検索</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>マイページ</span>
    </a>
  </nav>

  <!-- JavaScript読み込み -->
  <script src="app.js"></script>
</body>
</html>
